backend:
  name: github
  repo: playskang-svg/blog0001
  branch: main
  base_url: https://blog0001-decap-oauth.playskang.workers.dev
  auth_endpoint: auth

publish_mode: simple

media_folder: "src/assets/images/posts/uploads"
public_folder: "/uploads"

collections:
  - name: "posts"
    label: "글"
    folder: "src/content/posts/published"
    create: true
    slug: "{{fields.slug}}"
    path: "{{fields.category}}/{{fields.slug}}"
    extension: "mdx"
    format: "frontmatter"
    fields:
      # --- 필수 입력 (에디터 위) ---
      - label: "파일명(슬러그, 영문 소문자-하이픈만)"
        name: "slug"
        widget: "string"
        pattern:
          [
            "^[a-z0-9]+(-[a-z0-9]+)*$",
            "영문 소문자와 하이픈만 사용하세요 (예: matsuyama-airport-to-dogo)",
          ]
      - label: "제목"
        name: "title"
        widget: "string"
      - label: "설명 (SEO)"
        name: "description"
        widget: "text"
      - label: "카테고리"
        name: "category"
        widget: "select"
        options:
          - { label: "공항에서 숙소까지", value: "airport-to-stay" }
          - { label: "렌터카 없는 소도시", value: "no-car-small-city" }
          - { label: "섬·항구 환승", value: "island-and-port" }
          - { label: "관광지 가까운 숙소거점", value: "stay-base" }
          - { label: "늦은 도착·이른 출발", value: "late-arrival" }
      - label: "지역"
        name: "region"
        widget: "string"
      - label: "핵심 판단 기준 (한 문장)"
        name: "decision"
        widget: "text"
      - label: "발행일"
        name: "pubDatetime"
        widget: "datetime"

      # --- 본문 에디터 ---
      - label: "본문"
        name: "body"
        widget: "markdown"
        hint: "이미지는 위 '대표 이미지'가 아닌 본문 중간 사진은 media 업로드 버튼으로 올린 뒤, 실제 <Image> 태그로는 자동 변환되지 않습니다. 업로드된 경로를 확인해서 import 구문을 손으로 추가해야 합니다."

      # --- 공개 여부 (저장/발행) ---
      - label: "임시저장 (체크 해제하면 발행되어 사이트에 노출됩니다)"
        name: "draft"
        widget: "boolean"
        default: true

      # --- 선택 입력 (아래는 필요할 때만 채우세요) ---
      - label: "작성자"
        name: "author"
        widget: "string"
        default: "블로그팁스 편집팀"
        required: false
      - label: "수정일"
        name: "modDatetime"
        widget: "datetime"
        required: false
      - label: "추천글"
        name: "featured"
        widget: "boolean"
        default: false
        required: false
      - label: "교통수단"
        name: "transportModes"
        widget: "list"
        default: []
        required: false
      - label: "여행자 유형"
        name: "travelerTypes"
        widget: "list"
        default: []
        required: false
      - label: "정보 확인일"
        name: "sourceCheckedAt"
        widget: "date"
        required: false
      - label: "제휴 placement"
        name: "affiliatePlacements"
        widget: "select"
        multiple: true
        required: false
        default: []
        options:
          - {
              label: "일본 여행 프로모션 (공통)",
              value: "japan-promotion-general",
            }
      - label: "태그"
        name: "tags"
        widget: "list"
        default: ["others"]
        required: false
      - label: "대표 이미지 / ogImage"
        name: "ogImage"
        widget: "image"
        required: false
        media_folder: "/src/assets/images/posts/{{fields.category}}/{{fields.slug}}"
        public_folder: "/src/assets/images/posts/{{fields.category}}/{{fields.slug}}"
        hint: "⚠️ webp 파일만 올리세요. CMS는 파일 형식을 강제로 막지 못합니다 — jpg/png를 올리면 저장은 되지만 npm run build(content:validate)가 실패해서 사이트에 반영 안 됩니다. 업로드 전에 webp로 변환해서 올리세요."
      - label: "캐노니컬 URL"
        name: "canonicalURL"
        widget: "string"
        required: false
      - label: "수정 버튼 숨김"
        name: "hideEditPost"
        widget: "boolean"
        required: false
      - label: "타임존"
        name: "timezone"
        widget: "string"
        required: false

  - name: "pages"
    label: "고정 페이지"
    folder: "src/content/pages"
    create: true
    slug: "{{fields.slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - label: "파일명(슬러그)"
        name: "slug"
        widget: "string"
      - label: "제목"
        name: "title"
        widget: "string"
      - label: "설명"
        name: "description"
        widget: "text"
        required: false
      - label: "OG 이미지 경로"
        name: "ogImage"
        widget: "string"
        required: false
      - label: "캐노니컬 URL"
        name: "canonicalURL"
        widget: "string"
        required: false
      - label: "본문"
        name: "body"
        widget: "markdown"
