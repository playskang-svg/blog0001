<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>여행팁블로그 — 관리자</title>
    <style>
      :root {
        --admin-bar-h: 56px;
      }
      #admin-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 9999;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 6px 10px;
        padding: 8px 16px;
        background: #1f2937;
        color: #fff;
        font:
          14px/1.4 -apple-system,
          sans-serif;
      }
      #admin-bar a {
        color: #93c5fd;
      }
      #admin-bar button {
        padding: 6px 12px;
        border: 0;
        border-radius: 6px;
        background: #2563eb;
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
      #admin-bar button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      #upload-status:not(:empty) {
        width: 100%;
        text-align: center;
        font-size: 13px;
      }
      #nc-root {
        box-sizing: border-box;
        padding-top: var(--admin-bar-h);
      }
    </style>
  </head>
  <body>
    <div id="admin-bar">
      <span>
        ① 양식 받기
        <a href="/templates/travel-guide-template.mdx" download>기본 양식</a> ·
        <a href="/templates/blank-post-template.mdx" download>빈 양식</a>
        → ② 로컬 에디터로 작성 → ③ 여기로 업로드하면 바로 발행
      </span>
      <button type="button" id="upload-btn">글 파일 업로드</button>
      <input
        type="file"
        id="upload-input"
        accept=".mdx,.md,.webp,.jpg,.jpeg,.png"
        multiple
        hidden
      />
      <span id="upload-status"></span>
    </div>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      // 작성한 글 파일(.mdx)과 그 글에 쓰는 이미지를 저장소의 정해진 위치로
      // 바로 커밋한다. 경로는 파일명(=슬러그)과 frontmatter의 category로 정해진다.
      // 올린 글은 곧바로 공개되도록 draft·발행일을 맞춰서 커밋한다.
      (function () {
        const REPO = "playskang-svg/blog0001";
        const BRANCH = "main";
        const SITE = "https://blog.tipspedia.kr";
        const POSTS_DIR = "src/content/posts/published";
        const IMAGES_DIR = "src/assets/images/posts";
        const CATEGORIES = [
          "airport-to-stay",
          "no-car-small-city",
          "island-and-port",
          "stay-base",
          "late-arrival",
        ];
        const REQUIRED_FIELDS = [
          "title",
          "description",
          "category",
          "region",
          "decision",
        ];
        const SLUG_PATTERN = /^[a-z0-9]+(-[a-z0-9]+)*$/;
        const POST_EXTENSION = /\.(mdx|md)$/i;

        const bar = document.getElementById("admin-bar");
        const button = document.getElementById("upload-btn");
        const input = document.getElementById("upload-input");
        const statusLine = document.getElementById("upload-status");

        // 막대가 두 줄로 접히면 CMS 화면 상단을 가리므로 높이를 실측해 밀어준다.
        const syncBarHeight = () =>
          document.documentElement.style.setProperty(
            "--admin-bar-h",
            bar.offsetHeight + "px"
          );
        syncBarHeight();
        if (window.ResizeObserver) {
          new ResizeObserver(syncBarHeight).observe(bar);
        } else {
          window.addEventListener("resize", syncBarHeight);
        }

        function say(message, ok, href) {
          statusLine.textContent = message;
          statusLine.style.color =
            ok === undefined ? "#e5e7eb" : ok ? "#86efac" : "#fca5a5";
          if (href) {
            const link = document.createElement("a");
            link.href = href;
            link.target = "_blank";
            link.rel = "noopener";
            link.textContent = href;
            statusLine.append(" ", link);
          }
        }

        function authToken() {
          for (const key of ["decap-cms-user", "netlify-cms-user"]) {
            try {
              const saved = JSON.parse(localStorage.getItem(key) || "null");
              if (saved && saved.token) return saved.token;
            } catch (err) {
              // 손상된 값은 무시하고 다음 키를 본다
            }
          }
          return null;
        }

        function readFrontmatter(text) {
          const block = text.match(/^---\r?\n([\s\S]*?)\r?\n---/);
          if (!block) return null;
          const fields = {};
          for (const line of block[1].split(/\r?\n/)) {
            const pair = line.match(/^([A-Za-z_][A-Za-z0-9_]*):\s*(.*)$/);
            if (pair) {
              fields[pair[1]] = pair[2].trim().replace(/^["']|["']$/g, "");
            }
          }
          return fields;
        }

        function kstTimestamp() {
          const shifted = new Date(Date.now() + 9 * 60 * 60 * 1000);
          return shifted.toISOString().replace(/\.\d+Z$/, "+09:00");
        }

        // draft가 켜져 있거나 발행일이 미래면 사이트에 안 뜬다. 지금 공개되도록 맞춘다.
        function makeLive(text, fields) {
          const parts = text.match(/^(---\r?\n)([\s\S]*?)(\r?\n---)/);
          let front = parts[2];
          const applied = [];

          if (fields.draft !== "false") {
            front = /^draft:/m.test(front)
              ? front.replace(/^draft:.*$/m, "draft: false")
              : front + "\ndraft: false";
            applied.push("draft: false");
          }

          const pubAt = fields.pubDatetime
            ? new Date(fields.pubDatetime).getTime()
            : NaN;
          if (isNaN(pubAt) || pubAt > Date.now()) {
            const stamp = kstTimestamp();
            front = /^pubDatetime:/m.test(front)
              ? front.replace(/^pubDatetime:.*$/m, "pubDatetime: " + stamp)
              : front + "\npubDatetime: " + stamp;
            applied.push("pubDatetime: " + stamp);
          }

          return {
            text: parts[1] + front + parts[3] + text.slice(parts[0].length),
            applied,
          };
        }

        function toBase64(bytes) {
          let binary = "";
          for (const byte of new Uint8Array(bytes)) {
            binary += String.fromCharCode(byte);
          }
          return btoa(binary);
        }

        function github(path, options) {
          return fetch("https://api.github.com/repos/" + REPO + path, {
            ...options,
            headers: {
              Authorization: "token " + authToken(),
              Accept: "application/vnd.github+json",
            },
          });
        }

        async function commitFile(path, content, message) {
          const found = await github(
            "/contents/" + path + "?ref=" + BRANCH,
            {}
          );
          const sha = found.ok ? (await found.json()).sha : undefined;
          const saved = await github("/contents/" + path, {
            method: "PUT",
            body: JSON.stringify({ message, content, branch: BRANCH, sha }),
          });
          if (!saved.ok) {
            const error = await saved.json().catch(() => ({}));
            throw new Error(
              path + " — " + saved.status + " " + (error.message || "")
            );
          }
          return Boolean(sha);
        }

        async function upload(files) {
          const posts = files.filter(f => POST_EXTENSION.test(f.name));
          const images = files.filter(f => !POST_EXTENSION.test(f.name));

          if (posts.length !== 1) {
            return say(
              "글 파일(.mdx) 하나를 함께 골라주세요. 이미지만으로는 저장 위치를 알 수 없습니다.",
              false
            );
          }

          const post = posts[0];
          const slug = post.name.replace(POST_EXTENSION, "");
          if (!SLUG_PATTERN.test(slug)) {
            return say(
              "파일명은 영문 소문자·숫자·하이픈만 쓸 수 있습니다: " + post.name,
              false
            );
          }

          const text = await post.text();
          const fields = readFrontmatter(text);
          if (!fields) {
            return say("frontmatter(--- 블록)를 찾지 못했습니다.", false);
          }
          const missing = REQUIRED_FIELDS.filter(name => !fields[name]);
          if (missing.length) {
            return say("frontmatter에 빠진 항목: " + missing.join(", "), false);
          }
          if (!CATEGORIES.includes(fields.category)) {
            return say(
              "category 값이 올바르지 않습니다: " + fields.category,
              false
            );
          }

          const postPath =
            POSTS_DIR + "/" + fields.category + "/" + slug + ".mdx";
          const imageDir = IMAGES_DIR + "/" + fields.category + "/" + slug;
          const liveUrl = SITE + "/posts/" + slug + "/";
          const live = makeLive(text, fields);
          const plan = [postPath]
            .concat(images.map(image => imageDir + "/" + image.name))
            .concat(
              live.applied.length
                ? ["", "발행 설정: " + live.applied.join(", ")]
                : []
            )
            .concat(["", "공개 주소: " + liveUrl]);
          if (
            !confirm(
              plan.join("\n") + "\n\n올리면 바로 발행됩니다. 진행할까요?"
            )
          ) {
            return say("");
          }

          // 글보다 이미지를 먼저 올려야 중간 빌드가 깨지지 않는다.
          for (const image of images) {
            say("이미지 업로드 중… " + image.name);
            await commitFile(
              imageDir + "/" + image.name,
              toBase64(await image.arrayBuffer()),
              "image: " + slug + "/" + image.name
            );
          }

          say("글 업로드 중…");
          const updated = await commitFile(
            postPath,
            toBase64(new TextEncoder().encode(live.text)),
            "post: " + fields.title
          );

          say(
            (updated ? "수정 발행 완료" : "발행 완료") +
              " · 1~2분 뒤 아래 주소에 뜹니다 —",
            true,
            liveUrl
          );
        }

        button.addEventListener("click", () => {
          if (!authToken()) {
            return say("아래에서 GitHub 로그인을 먼저 해주세요.", false);
          }
          input.click();
        });

        input.addEventListener("change", async () => {
          const files = Array.from(input.files || []);
          input.value = "";
          if (!files.length) return;
          button.disabled = true;
          try {
            await upload(files);
          } catch (err) {
            say("업로드 실패: " + err.message, false);
          } finally {
            button.disabled = false;
          }
        });
      })();
    </script>
  </body>
</html>
